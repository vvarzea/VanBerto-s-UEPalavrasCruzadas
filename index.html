<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>VanBerto's — Palavras Cruzadas da UE 🇪🇺</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#05091a;--gold:#FFD600;--cell:42px;}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:'Nunito',sans-serif;color:#fff;overflow-x:hidden;}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 20%,rgba(21,101,255,0.20),transparent 55%),
    radial-gradient(ellipse at 80% 80%,rgba(0,150,136,0.15),transparent 55%),
    linear-gradient(160deg,#02040f,#060a1e,#080520);}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 20%,rgba(255,255,255,.7),transparent),
    radial-gradient(1px 1px at 30% 60%,rgba(255,255,200,.5),transparent),
    radial-gradient(2px 2px at 55% 10%,rgba(255,255,255,.6),transparent),
    radial-gradient(1px 1px at 78% 38%,rgba(200,220,255,.6),transparent),
    radial-gradient(1px 1px at 18% 82%,rgba(220,200,255,.5),transparent);
  animation:twk 4s ease-in-out infinite alternate;}
@keyframes twk{0%{opacity:.4;}100%{opacity:1;}}

#app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
  padding:12px 10px 150px;gap:14px;min-height:100vh;}

/* HEADER */
header{width:100%;max-width:min(1600px,98vw);display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(5,5,20,.98),rgba(10,10,28,.95));
  border:1px solid rgba(255,214,0,.18);border-radius:18px;
  padding:10px 16px;backdrop-filter:blur(14px);
  box-shadow:0 4px 24px rgba(0,0,0,.5);}
.htitle{font-family:'Boogaloo',cursive;font-size:clamp(15px,4vw,22px);color:var(--gold);}
.hinfo{display:flex;gap:8px;align-items:center;}
#timer{font-family:'Boogaloo',cursive;font-size:clamp(13px,3.5vw,18px);color:#fff;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:4px 12px;}
#score{font-family:'Boogaloo',cursive;font-size:clamp(12px,3vw,16px);color:var(--gold);}
.hbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#fff;border-radius:9px;width:34px;height:34px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  touch-action:manipulation;transition:all .15s;}
.hbtn:active{transform:scale(.88);}

/* LAYOUT */
#mainArea{width:100%;max-width:min(1600px,98vw);display:flex;flex-direction:column;gap:14px;}
@media(min-width:700px){
  #mainArea{flex-direction:row;align-items:flex-start;}
  #gridWrap{flex:1;min-width:0;}
  #cluesPanel{width:clamp(220px,26vw,430px);flex-shrink:0;max-height:calc(100vh - 200px);}
}
@media(min-width:1100px){
  .clue-section h3{font-size:19px;}
  .clue-num{font-size:16px;min-width:28px;}
  .clue-txt{font-size:15px;}
  .htitle{font-size:26px;}
  .clue-item{padding:7px 10px;}
}
@media(min-width:1600px){
  .clue-section h3{font-size:22px;}
  .clue-txt{font-size:17px;}
  .clue-num{font-size:18px;}
}

/* GRID WRAPPER — escala automaticamente para caber no ecrã */
#gridWrap{
  background:rgba(14,18,50,.97);border:2px solid rgba(255,214,0,.20);
  border-radius:20px;padding:14px;
  box-shadow:0 12px 48px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:visible;
  /* impede que o wrapper cresça além do disponível */
  max-width:100%;
}
/* Contentor que aplica a escala */
#gridScaler{
  display:inline-block;
  transform-origin:top left;
  /* escala é definida via JS */
}
#cwGrid{display:inline-grid;gap:3px;position:relative;}
.cw-cell{
  width:var(--cell);height:var(--cell);position:relative;
  border-radius:5px;overflow:hidden;}
.cw-cell.black{background:rgba(10,12,30,.6);border-radius:4px;}
.cw-cell.white{background:#ffffff;border:2px solid #b0b8cc;cursor:pointer;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);transition:transform .15s,border-color .2s,background .2s;}
.cw-cell.white.active{background:#fff9c4;border-color:#f9a825;}
.cw-cell.white.word-active{background:#dbeafe;border-color:#3b82f6;}
.cw-cell.white.correct{background:#d1fae5;border-color:#10b981;}
.cw-cell.white.cell-pop{animation:cellPop .35s ease;}
@keyframes cellPop{
  0%{transform:scale(1);}
  40%{transform:scale(1.18);box-shadow:0 0 12px rgba(16,185,129,.6);}
  100%{transform:scale(1);}
}
.cw-cell.white.wrong-flash{animation:wrongShake .4s ease;}
@keyframes wrongShake{
  0%,100%{transform:translateX(0);background:#fff;}
  20%{transform:translateX(-3px);background:#fee2e2;}
  40%{transform:translateX(3px);background:#fecaca;}
  60%{transform:translateX(-2px);background:#fee2e2;}
  80%{transform:translateX(2px);background:#fff;}
}
.cw-cell input{
  position:absolute;inset:0;width:100%;height:100%;
  background:transparent;border:none;outline:none;
  font-family:'Boogaloo',cursive;font-size:20px;
  font-weight:900;text-align:center;text-transform:uppercase;
  color:#1e293b;caret-color:transparent;cursor:pointer;
  padding-top:8px;
  -webkit-user-select:none;}
.cw-num{position:absolute;top:2px;left:3px;font-size:9px;
  font-family:'Boogaloo',cursive;color:#64748b;line-height:1;z-index:2;pointer-events:none;}

/* CLUES */
#cluesPanel{background:rgba(14,18,50,.97);border:2px solid rgba(255,214,0,.18);
  border-radius:20px;padding:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);max-height:75vh;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,214,0,.3) transparent;}
#cluesPanel::-webkit-scrollbar{width:4px;}
#cluesPanel::-webkit-scrollbar-thumb{background:rgba(255,214,0,.3);border-radius:2px;}
.clue-section h3{font-family:'Boogaloo',cursive;color:var(--gold);
  font-size:clamp(13px,3.5vw,16px);margin-bottom:8px;letter-spacing:.5px;}
.clue-item{display:flex;gap:8px;align-items:flex-start;
  padding:5px 8px;border-radius:10px;cursor:pointer;
  transition:background .15s;margin-bottom:3px;}
.clue-item:hover,.clue-item.active{background:rgba(21,101,255,.20);}
.clue-item.correct{opacity:.5;}
.clue-num{font-family:'Boogaloo',cursive;color:var(--gold);font-size:13px;
  min-width:22px;flex-shrink:0;}
.clue-txt{font-family:'Nunito',sans-serif;font-size:clamp(11px,2.8vw,13px);
  color:rgba(255,255,255,.75);line-height:1.4;}
.clue-txt.correct{text-decoration:line-through;color:rgba(0,200,83,.7);}

/* ACTIVE CLUE BANNER */
#activeClueBanner{width:100%;max-width:min(1600px,98vw);
  background:linear-gradient(135deg,rgba(21,101,255,.14),rgba(124,58,237,.10));
  border:1.5px solid rgba(21,101,255,.35);
  border-radius:16px;padding:10px 14px;
  display:none;line-height:1.4;
  box-shadow:0 4px 18px rgba(0,0,0,.2);}
#activeClueBanner .clue-dir{
  display:inline-block;font-family:'Boogaloo',cursive;
  font-size:clamp(10px,2.5vw,12px);
  padding:3px 10px;border-radius:20px;margin-right:6px;
  font-weight:700;letter-spacing:.5px;vertical-align:middle;}
#activeClueBanner .clue-dir.across{background:rgba(21,101,255,.30);color:#93c5fd;}
#activeClueBanner .clue-dir.down{background:rgba(124,58,237,.30);color:#c4b5fd;}
#activeClueBanner .clue-main{
  font-family:'Boogaloo',cursive;font-size:clamp(13px,3.5vw,16px);color:#fff;}
#activeClueBanner .clue-main span{color:var(--gold);}
#activeClueBanner .word-pattern{
  display:flex;gap:3px;margin-top:7px;flex-wrap:wrap;}
#activeClueBanner .wp-cell{
  width:clamp(22px,5vw,28px);height:clamp(22px,5vw,28px);
  border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:'Boogaloo',cursive;font-size:clamp(12px,3vw,16px);
  font-weight:900;text-transform:uppercase;line-height:1;}
#activeClueBanner .wp-cell.filled{
  background:rgba(16,185,129,.25);border:1.5px solid rgba(16,185,129,.5);color:#6ee7b7;}
#activeClueBanner .wp-cell.empty{
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.25);}
#activeClueBanner .wp-cell.current{
  background:rgba(255,214,0,.15);border:1.5px solid rgba(255,214,0,.5);color:var(--gold);}

/* MODAL */
.movl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;}
.mbg{position:absolute;inset:0;background:rgba(2,2,14,.92);backdrop-filter:blur(12px);}
.mcard{position:relative;z-index:1;
  background:linear-gradient(155deg,rgba(14,14,40,.98),rgba(6,6,20,.98));
  border:2px solid rgba(255,214,0,.30);border-radius:26px;
  padding:clamp(20px,5vw,34px) clamp(22px,6vw,42px);
  text-align:center;width:min(440px,96%);
  box-shadow:0 0 90px rgba(21,101,255,.12),0 24px 64px rgba(0,0,0,.65);}
.mcard h2{font-family:'Boogaloo',cursive;color:var(--gold);font-size:clamp(24px,7vw,38px);
  margin-bottom:8px;}
.mcard p{color:rgba(255,255,255,.60);font-size:clamp(12px,3vw,15px);line-height:1.75;margin-bottom:12px;}
.mscore{font-family:'Boogaloo',cursive;font-size:clamp(44px,12vw,64px);
  color:var(--gold);text-shadow:0 0 34px rgba(255,214,0,.7);line-height:1;}
.bplay{font-family:'Boogaloo',cursive;
  background:linear-gradient(135deg,#1565ff,#7c3aed);
  border:none;color:#fff;font-size:clamp(16px,4.5vw,21px);
  padding:12px 40px;border-radius:50px;cursor:pointer;
  box-shadow:0 6px 28px rgba(21,101,255,.45);
  margin-top:12px;transition:transform .1s;touch-action:manipulation;}
.bplay:active{transform:scale(.96);}
.bsec{font-family:'Boogaloo',cursive;background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.14);color:rgba(255,255,255,.6);
  font-size:clamp(13px,3.5vw,16px);padding:9px 24px;border-radius:50px;
  cursor:pointer;margin-top:8px;display:inline-block;touch-action:manipulation;}
.diff-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.dbtn{font-family:'Boogaloo',cursive;font-size:clamp(11px,2.8vw,13px);
  padding:8px 14px;border-radius:18px;border:2px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);cursor:pointer;
  transition:all .2s;line-height:1.3;touch-action:manipulation;}
.dbtn.on{border-color:var(--gold);color:var(--gold);background:rgba(255,214,0,.10);}

/* HINT & ERASER BTNS */
.hbtn .badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;
  font-size:9px;font-family:'Nunito',sans-serif;font-weight:900;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;line-height:1;padding:0 3px;}
.hbtn{position:relative;}

/* CONFETTI CANVAS */
#confettiCanvas{position:fixed;inset:0;z-index:60;pointer-events:none;}

/* STARS */
.stars-row{display:flex;gap:6px;justify-content:center;margin:10px 0 4px;}
.star{font-size:clamp(28px,8vw,42px);opacity:.2;transition:all .4s;filter:grayscale(1);}
.star.earned{opacity:1;filter:grayscale(0);animation:starPop .5s ease backwards;}
.star:nth-child(2).earned{animation-delay:.15s;}
.star:nth-child(3).earned{animation-delay:.3s;}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg);opacity:0;}
  60%{transform:scale(1.3) rotate(5deg);}100%{transform:scale(1) rotate(0);opacity:1;}}

@keyframes vbf{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
@keyframes vbBlink{0%,92%,100%{transform:scaleY(0);}95%{transform:scaleY(1);}}
@keyframes waveVB{0%{transform:rotate(0deg);}25%{transform:rotate(-18deg);}50%{transform:rotate(0deg);}75%{transform:rotate(-18deg);}100%{transform:rotate(0deg);}}
@keyframes vbd{0%{transform:translateY(0);}15%{transform:translateY(-16px) rotate(-12deg);}30%{transform:translateY(0);}45%{transform:translateY(-16px) rotate(12deg);}60%{transform:translateY(0);}100%{transform:translateY(0);}}

/* ═══ NOME DO JOGADOR ═══ */
.name-row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 14px;}
.name-row label{font-family:'Boogaloo',cursive;color:var(--gold);font-size:clamp(14px,3.6vw,17px);white-space:nowrap;}
.name-row input{
  flex:1;min-width:150px;max-width:240px;
  border:2px solid rgba(255,214,0,.55);border-radius:12px;padding:8px 12px;
  font-size:16px;font-family:'Nunito',sans-serif;font-weight:900;
  background:rgba(255,255,255,.06);color:#fff;outline:none;
  box-shadow:2px 2px 0 rgba(255,214,0,.35);transition:box-shadow .15s;
}
.name-row input:focus{box-shadow:2px 2px 0 var(--gold),0 0 0 3px rgba(255,214,0,.25);}
.name-row input::placeholder{color:rgba(255,214,0,.45);}

/* ═══ ROBOT FLUTUANTE FIXO (VanBerto's atual) ═══ */
#fixed-robot-wrap{
  position:fixed;bottom:clamp(.6rem,2vh,1.2rem);right:clamp(.6rem,2vw,1.2rem);
  z-index:70;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;
}
#fixed-vb-robot{
  width:clamp(64px,8.5vw,92px);height:auto;display:block;cursor:pointer;
  animation:vbFloat 3s ease-in-out infinite;filter:drop-shadow(0 0 12px #7dd3fc);
}
#fixed-vb-robot:hover{filter:drop-shadow(0 0 24px #38bdf8);}
#fixed-vb-robot:focus-visible{outline:3px solid #ffd700;outline-offset:4px;border-radius:12px;}
#fixed-vb-robot.bounce{animation:robotPop .65s cubic-bezier(.34,1.56,.64,1),vbFloat 3s ease-in-out .65s infinite;}
@keyframes vbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
@keyframes robotPop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-6deg)}70%{transform:translateY(-8px) rotate(5deg)}}
#fixed-bubble{
  --bc:#dcebff;
  background:linear-gradient(135deg,var(--bc),#fff);
  border:3px solid #0f172a;outline:2px solid #1e293b;outline-offset:-4px;
  border-radius:16px;padding:6px 10px 5px;box-shadow:3px 3px 0 #0f172a;
  font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
  font-size:clamp(.6rem,1.5vw,.78rem);font-weight:bold;color:#0f172a;
  max-width:160px;min-width:80px;text-align:center;pointer-events:none;position:relative;
  opacity:0;transform:translateY(-6px) scale(.88);
  transition:opacity .38s,transform .38s cubic-bezier(.34,1.56,.64,1);margin-bottom:4px;
}
#fixed-bubble::after{content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid #0f172a;}
#fixed-bubble::before{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid var(--bc);z-index:1;}
#fixed-bubble.show{opacity:1;transform:translateY(0) scale(1);}
#fixed-robot-name{
  font-family:'Boogaloo',cursive;font-size:clamp(.7rem,1.5vw,.85rem);color:var(--gold);
  text-shadow:0 1px 6px rgba(0,0,0,.8),0 0 10px rgba(21,101,255,.5);
  text-align:center;line-height:1.2;max-width:150px;overflow-wrap:anywhere;
}
#prof-tag{position:fixed;bottom:.6rem;left:50%;transform:translateX(-50%);z-index:600;font-family:'Nunito',sans-serif;font-size:clamp(.65rem,1.8vw,.78rem);color:rgba(255,214,0,.85);font-weight:800;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none;}
@media(prefers-reduced-motion:reduce){#fixed-vb-robot{animation:none;}}

</style>
</head>
<body>
<div id="app">
  <header>
    <span class="htitle">🇪🇺 VanBerto's — Palavras Cruzadas</span>
    <div class="hinfo">
      <span id="score">0/0 ✅</span>
      <span id="timer">00:00</span>
      <button class="hbtn" id="btnHint" onclick="useHint()" title="Dica">💡<span class="badge" id="hintBadge">3</span></button>
      <button class="hbtn" id="btnErase" onclick="eraseCell()" title="Apagar">⌫</button>
      <button class="hbtn" id="btnSnd" onclick="sndOn=!sndOn;this.textContent=sndOn?'🔊':'🔇'">🔊</button>
      <button class="hbtn" id="btnFs" onclick="toggleFullscreen()" title="Ecrã inteiro" aria-label="Ecrã inteiro"></button>
      <button class="hbtn" onclick="showStart()">🏠</button>
    </div>
  </header>

  <div id="activeClueBanner"></div>

  <canvas id="confettiCanvas"></canvas>

  <div id="mainArea">
    <div id="gridWrap"><div id="gridScaler"><div id="cwGrid"></div></div></div>
    <div id="cluesPanel">
      <div class="clue-section" id="acrossSection">
        <h3>➡️ Horizontal</h3>
        <div id="acrossClues"></div>
      </div>
      <div class="clue-section" style="margin-top:14px;" id="downSection">
        <h3>⬇️ Vertical</h3>
        <div id="downClues"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL INÍCIO -->
<div class="movl" id="startMod">
  <div class="mbg"></div>
  <div class="mcard">
    <h2>VanBerto's — Palavras Cruzadas</h2>
    <p>Preenche as palavras cruzadas<br>com os países da União Europeia!<br>Usa as pistas para te ajudar.</p>
    <div class="name-row">
      <label for="playerName">O teu nome:</label>
      <input type="text" id="playerName" maxlength="22" placeholder="Escreve o teu nome…" autocomplete="off" lang="pt-PT" spellcheck="true" inputmode="text">
    </div>
    <div class="diff-row">
      <button class="dbtn on" id="d1" onclick="setDiff(1)">😊 Fácil<br><small>8 palavras</small></button>
      <button class="dbtn" id="d2" onclick="setDiff(2)">⚡ Normal<br><small>13 palavras</small></button>
      <button class="dbtn" id="d3" onclick="setDiff(3)">🔥 Difícil<br><small>18 palavras</small></button>
    </div>
    <button class="bplay" onclick="startGame()">✏️ Jogar!</button>
  </div>
</div>

<!-- MODAL FIM -->
<div class="movl" id="endMod" style="display:none;">
  <div class="mbg"></div>
  <div class="mcard">
    <h2 id="endTitle">Parabéns!</h2>
    <div class="stars-row" id="starsRow">
      <span class="star" id="star1">⭐</span>
      <span class="star" id="star2">⭐</span>
      <span class="star" id="star3">⭐</span>
    </div>
    <div class="mscore" id="endTime">00:00</div>
    <p id="endTxt"></p>
    <button class="bplay" onclick="startGame()">🔄 Jogar outra vez</button>
    <br><button class="bsec" onclick="showStart()">🏠 Início</button>
  </div>
</div>

<!-- ═══ ROBOT FLUTUANTE FIXO ═══ -->
<div id="fixed-robot-wrap">
  <div id="fixed-bubble" role="status" aria-live="polite"></div>
  <canvas id="fixed-vb-robot" width="96" height="96" role="button" tabindex="0" aria-label="VanBerto's — clica para falar"></canvas>
  <div id="fixed-robot-name">👤 Herói da UE</div>
</div>
<div id="prof-tag">© Prof.ª Vanda Várzea</div>

<script>
// ─── DADOS ───────────────────────────────────────────────────────
// word = sem acentos (matching na grelha), display = com acentos (visual)
const ALL_ENTRIES = [
  {word:'PORTUGAL',   display:'PORTUGAL',   clue:'País ibérico com capital em Lisboa'},
  {word:'ESPANHA',    display:'ESPANHA',    clue:'País ibérico com capital em Madrid'},
  {word:'FRANCA',     display:'FRANÇA',     clue:'País com a Torre Eiffel em Paris'},
  {word:'ALEMANHA',   display:'ALEMANHA',   clue:'País com a capital Berlim'},
  {word:'ITALIA',     display:'ITÁLIA',     clue:'País em forma de bota com capital Roma'},
  {word:'BELGICA',    display:'BÉLGICA',    clue:'País com capital Bruxelas, sede da UE'},
  {word:'POLONIA',    display:'POLÓNIA',    clue:'País da Europa de Leste com capital Varsóvia'},
  {word:'SUECIA',     display:'SUÉCIA',     clue:'País escandinavo com capital Estocolmo'},

// ─── BUILD PUZZLE ─────────────────────────────────────────────────
function buildPuzzle(){
  puzzle = PUZZLES[diff];
  solvedEntries = [];
  gridData = {}; // key:"r,c" => {letter, entries:[]}

  // compute grid bounds
  let maxR=0, maxC=0;
  puzzle.forEach(e=>{
    const len=e.word.length;
    if(e.dir==='across'){maxR=Math.max(maxR,e.row);maxC=Math.max(maxC,e.col+len-1);}
    else{maxR=Math.max(maxR,e.row+len-1);maxC=Math.max(maxC,e.col);}
  });
  const ROWS=maxR+1, COLS=maxC+1;

  // fill gridData
  puzzle.forEach(e=>{
    const entryData=ALL_ENTRIES.find(x=>x.word===e.word);
    const displayWord=entryData?entryData.display:e.word;
    for(let i=0;i<e.word.length;i++){
      const r=e.dir==='across'?e.row:e.row+i;
      const c=e.dir==='across'?e.col+i:e.col;
      const key=r+','+c;
      if(!gridData[key]) gridData[key]={letter:e.word[i],displayLetter:displayWord[i],entries:[],userInput:'',r,c};
      gridData[key].entries.push({entry:e,pos:i});
    }
  });

  // number cells
  let num=1;
  const numbering={};
  for(let r=0;r<=maxR;r++) for(let c=0;c<=maxC;c++){
    const key=r+','+c;
    if(!gridData[key]) continue;
    const startsAcross=puzzle.some(e=>e.dir==='across'&&e.row===r&&e.col===c);
    const startsDown=puzzle.some(e=>e.dir==='down'&&e.row===r&&e.col===c);
    if(startsAcross||startsDown){
      numbering[key]=num;
      puzzle.forEach(e=>{if(e.row===r&&e.col===c) e.num=num;});
      num++;
    }
  }

  renderPuzzle(ROWS,COLS,numbering);
  renderClues();
  updateScore();
}

// ─── RENDER GRID ─────────────────────────────────────────────────
function renderPuzzle(ROWS,COLS,numbering){
  const g=document.getElementById('cwGrid');
  g.style.gridTemplateColumns=`repeat(${COLS},var(--cell))`;
  g.innerHTML='';
  cells={};

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const div=document.createElement('div');
    div.className='cw-cell';
    const key=r+','+c;
    if(gridData[key]){
      div.classList.add('white');
      if(numbering[key]){
        const num=document.createElement('span');
        num.className='cw-num';num.textContent=numbering[key];
        div.appendChild(num);
      }
      const inp=document.createElement('input');
      inp.maxLength=1;inp.autocomplete='off';inp.autocorrect='off';
      inp.autocapitalize='characters';inp.spellcheck=false;
      inp.dataset.r=r;inp.dataset.c=c;
      inp.addEventListener('focus',()=>onCellFocus(r,c));
      inp.addEventListener('input',e=>onInput(e,r,c));
      inp.addEventListener('keydown',e=>onKeyDown(e,r,c));
      inp.addEventListener('click',()=>onCellClick(r,c));
      div.appendChild(inp);
      cells[key]=div;
    } else {
      div.classList.add('black');
    }
    g.appendChild(div);
  }
}

// ─── RENDER CLUES ────────────────────────────────────────────────
function renderClues(){
  const ac=document.getElementById('acrossClues');
  const dn=document.getElementById('downClues');
  ac.innerHTML='';dn.innerHTML='';

  const entryData={}; // word->clue lookup
  ALL_ENTRIES.forEach(e=>entryData[e.word]=e.clue);

  puzzle.filter(e=>e.dir==='across').sort((a,b)=>a.num-b.num).forEach(e=>{
    const div=buildClueItem(e,entryData[e.word]||e.word);
    ac.appendChild(div);
  });
  puzzle.filter(e=>e.dir==='down').sort((a,b)=>a.num-b.num).forEach(e=>{
    const div=buildClueItem(e,entryData[e.word]||e.word);
    dn.appendChild(div);
  });
}

function buildClueItem(e,clue){
  const div=document.createElement('div');
  div.className='clue-item'+(solvedEntries.includes(e.id)?' correct':'');
  div.id='clue-'+e.dir+'-'+e.id;
  div.innerHTML=`<span class="clue-num">${e.num}${e.dir==='across'?'→':'↓'}</span>
    <span class="clue-txt${solvedEntries.includes(e.id)?' correct':''}">${clue} (${e.word.length})</span>`;
  div.addEventListener('click',()=>focusEntry(e));
  return div;
}

// ─── INTERACTION ─────────────────────────────────────────────────
let lastClickedCell = null;

function onCellClick(r,c){
  const key=r+','+c;
  if(!gridData[key]) return;
  const entries=getEntriesAt(r,c);
  if(!entries.length) return;

  if(entries.length===1){
    // só uma palavra — foca sempre nela
    focusEntry(entries[0],r,c);
  } else {
    // interseção — alterna direção ao clicar na mesma célula
    const sameCell=(lastClickedCell===key);
    if(sameCell && activeEntry){
      const other=entries.find(e=>e.id!==activeEntry.id);
      if(other){ focusEntry(other,r,c); return; }
    }
    // prefere manter direção atual se possível
    const same=entries.find(e=>activeEntry && e.dir===activeEntry.dir);
    focusEntry(same||entries[0], r, c);
  }
  lastClickedCell=key;
}

function onCellFocus(r,c){
  // chamado pelo focus nativo — não muda a entrada ativa
  const key=r+','+c;
  if(!gridData[key]||!activeEntry) return;
  const entries=getEntriesAt(r,c);
  if(!entries.find(e=>e.id===activeEntry.id)){
    // célula não pertence à entrada ativa — muda
    const same=entries.find(e=>activeEntry && e.dir===activeEntry.dir);
    const entry=same||entries[0];
    if(entry) focusEntry(entry,r,c);
  }
}

function getEntriesAt(r,c){
  const key=r+','+c;
  if(!gridData[key]) return [];
  return gridData[key].entries.map(e=>e.entry);
}

function focusEntry(entry, focusR, focusC){
  activeEntry=entry;
  highlightEntry(entry);
  // banner com pista melhorada
  const entryData=ALL_ENTRIES.find(e=>e.word===entry.word);
  const banner=document.getElementById('activeClueBanner');
  banner.style.display='block';
  const dirClass=entry.dir==='across'?'across':'down';
  const dirLabel=entry.dir==='across'?'➡️ Horizontal':'⬇️ Vertical';
  const clueText=entryData?entryData.clue:entry.word;
  banner.innerHTML=
    `<div class="clue-main"><span class="clue-dir ${dirClass}">${dirLabel}</span>`+
    `<span>${entry.num}</span> ${clueText} <span style="color:rgba(255,255,255,.35)">(${entry.word.length})</span></div>`+
    `<div class="word-pattern" id="wordPattern"></div>`;
  updateWordPattern();
  speak(clueText);
  // destaca pista
  document.querySelectorAll('.clue-item').forEach(el=>el.classList.remove('active'));
  const clueEl=document.getElementById('clue-'+entry.dir+'-'+entry.id);
  if(clueEl){clueEl.classList.add('active');clueEl.scrollIntoView({block:'nearest',behavior:'smooth'});}
  // foca a célula certa: a indicada, ou a primeira vazia da palavra
  let targetR=focusR??entry.row, targetC=focusC??entry.col;
  // se a célula indicada já está certa, vai para a primeira vazia
  if(focusR==null){
    for(let i=0;i<entry.word.length;i++){
      const r=entry.dir==='across'?entry.row:entry.row+i;
      const c=entry.dir==='across'?entry.col+i:entry.col;
      if(!gridData[r+','+c]?.userInput){ targetR=r; targetC=c; break; }
    }
  }
  const inp=getInput(targetR,targetC);
  if(inp) setTimeout(()=>inp.focus(),10);
}

function updateWordPattern(){
  if(!activeEntry) return;
  const wp=document.getElementById('wordPattern');
  if(!wp) return;
  const focused=document.activeElement;
  const focusR=focused?.dataset?.r!=null?parseInt(focused.dataset.r):null;
  const focusC=focused?.dataset?.c!=null?parseInt(focused.dataset.c):null;
  let html='';
  for(let i=0;i<activeEntry.word.length;i++){
    const r=activeEntry.dir==='across'?activeEntry.row:activeEntry.row+i;
    const c=activeEntry.dir==='across'?activeEntry.col+i:activeEntry.col;
    const key=r+','+c;
    const d=gridData[key];
    const raw=d?.userInput||'';
    // mostra com acento se correto, sem se errado
    const letter=raw?(raw===d.letter?d.displayLetter:raw):'';
    const isCurrent=(r===focusR && c===focusC);
    const cls=isCurrent?'current':letter?'filled':'empty';
    html+=`<div class="wp-cell ${cls}">${letter||'·'}</div>`;
  }
  wp.innerHTML=html;
}

function highlightEntry(entry){
  document.querySelectorAll('.cw-cell.white').forEach(el=>{
    el.classList.remove('active','word-active');
  });
  for(let i=0;i<entry.word.length;i++){
    const r=entry.dir==='across'?entry.row:entry.row+i;
    const c=entry.dir==='across'?entry.col+i:entry.col;
    const el=cells[r+','+c];
    if(el) el.classList.add('word-active');
  }
}

function getInput(r,c){
  const el=cells[r+','+c];
  return el?el.querySelector('input'):null;
}

// Remove acentos para comparação
function stripAccents(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function onInput(e,r,c){
  const inp=e.target;
  // aceita qualquer letra — substitui diretamente sem precisar apagar
  let val=inp.value.replace(/[^a-zA-ZÀ-ú]/g,'').toUpperCase().slice(-1);
  // normaliza sem acentos para matching
  const valNorm=stripAccents(val);
  const key=r+','+c;
  if(gridData[key]){
    gridData[key].userInput=valNorm;
    // se a letra está correta, mostra a versão com acento
    if(valNorm===gridData[key].letter){
      inp.value=gridData[key].displayLetter;
    } else {
      inp.value=valNorm;
    }
  }
  checkCellCorrect(r,c);
  if(valNorm) advanceCursor(r,c);
  updateScore();
  updateWordPattern();
}

function onKeyDown(e,r,c){
  if(e.key==='Backspace'){
    const key=r+','+c;
    const d=gridData[key];
    if(d && d.userInput){
      // tem letra — apaga só esta célula
      d.userInput='';
      const inp=getInput(r,c);
      if(inp) inp.value='';
      checkCellCorrect(r,c);
      updateScore();
    } else {
      // célula vazia — recua E apaga a anterior
      retreatCursor(r,c);
    }
    updateWordPattern();
    e.preventDefault();
  }
  else if(e.key==='ArrowRight'){ moveDir(r,c,0,1,'across');  e.preventDefault(); }
  else if(e.key==='ArrowLeft'){  moveDir(r,c,0,-1,'across'); e.preventDefault(); }
  else if(e.key==='ArrowDown'){  moveDir(r,c,1,0,'down');    e.preventDefault(); }
  else if(e.key==='ArrowUp'){    moveDir(r,c,-1,0,'down');   e.preventDefault(); }
  else if(e.key==='Enter'||e.key===' '){
    // Enter/Espaço alterna direção na interseção
    const entries=getEntriesAt(r,c);
    if(entries.length>1){
      const other=entries.find(e=>e.id!==activeEntry?.id);
      if(other) focusEntry(other,r,c);
    }
    e.preventDefault();
  }
}

function moveDir(r,c,dr,dc,preferDir){
  // seta muda direção ativa se necessário, depois move
  if(activeEntry && activeEntry.dir!==preferDir){
    const entries=getEntriesAt(r,c);
    const match=entries.find(e=>e.dir===preferDir);
    if(match){ focusEntry(match,r,c); return; }
  }
  const nr=r+dr, nc=c+dc;
  if(cells[nr+','+nc]){
    const inp=getInput(nr,nc);
    if(inp) inp.focus();
  }
}

function advanceCursor(r,c){
  if(!activeEntry) return;
  const dr=activeEntry.dir==='down'?1:0, dc=activeEntry.dir==='across'?1:0;
  // procura próxima célula vazia ou errada da palavra
  let nr=r+dr, nc=c+dc;
  while(cells[nr+','+nc]){
    const key=nr+','+nc;
    const belongs=gridData[key]?.entries.some(e=>e.entry.id===activeEntry.id);
    if(!belongs) break;
    if(!gridData[key]?.userInput){
      getInput(nr,nc)?.focus(); return;
    }
    nr+=dr; nc+=dc;
  }
  // se todas as células têm letra, verifica se está resolvida
  if(isEntrySolved(activeEntry)){
    checkEntrySolved(activeEntry);
    goToNextEntry();
  } else {
    // não está resolvida — foca a primeira célula errada desta palavra
    for(let i=0;i<activeEntry.word.length;i++){
      const er=activeEntry.dir==='across'?activeEntry.row:activeEntry.row+i;
      const ec=activeEntry.dir==='across'?activeEntry.col+i:activeEntry.col;
      const ek=er+','+ec;
      if(gridData[ek] && gridData[ek].userInput!==gridData[ek].letter){
        getInput(er,ec)?.focus(); return;
      }
    }
  }
}

function goToNextEntry(){
  if(!activeEntry) return;
  // ordena todas as entradas por número e pega a próxima não resolvida
  const sorted=[...puzzle].sort((a,b)=>a.num-b.num||(a.dir==='across'?-1:1));
  const idx=sorted.findIndex(e=>e.id===activeEntry.id);
  for(let i=1;i<=sorted.length;i++){
    const next=sorted[(idx+i)%sorted.length];
    if(!solvedEntries.includes(next.id)){
      focusEntry(next);
      return;
    }
  }
}

function retreatCursor(r,c){
  if(!activeEntry) return;
  const dr=activeEntry.dir==='down'?-1:0, dc=activeEntry.dir==='across'?-1:0;
  const nr=r+dr, nc=c+dc;
  const key=nr+','+nc;
  if(cells[key]){
    // verifica se a célula anterior pertence à entrada ativa
    const belongs=gridData[key]?.entries.some(e=>e.entry.id===activeEntry.id);
    if(belongs){
      gridData[key].userInput='';
      const inp=getInput(nr,nc);
      if(inp){ inp.value=''; inp.focus(); }
      checkCellCorrect(nr,nc);
      updateScore();
    }
  }
}

function checkCellCorrect(r,c){
  const key=r+','+c;
  const d=gridData[key];
  if(!d) return;
  const el=cells[key];
  if(!el) return;
  const inp=getInput(r,c);
  if(d.userInput===d.letter){
    // mostra a versão com acento
    if(inp) inp.value=d.displayLetter;
    if(!el.classList.contains('correct')){
      el.classList.add('correct');
      // pop animation
      el.classList.remove('cell-pop');
      void el.offsetWidth;
      el.classList.add('cell-pop');
    }
  } else {
    el.classList.remove('correct');
    // wrong flash if there's a wrong letter
    if(d.userInput && d.userInput!==d.letter){
      el.classList.remove('wrong-flash');
      void el.offsetWidth;
      el.classList.add('wrong-flash');
      setTimeout(()=>el.classList.remove('wrong-flash'),450);
    }
  }
  // check if whole entry is solved
  if(activeEntry) checkEntrySolved(activeEntry);
  // also check all entries on this cell
  getEntriesAt(r,c).forEach(e=>checkEntrySolved(e));
}

function checkEntrySolved(entry){
  const solved=isEntrySolved(entry);
  if(solved&&!solvedEntries.includes(entry.id)){
    solvedEntries.push(entry.id);
    const entryData=ALL_ENTRIES.find(e=>e.word===entry.word);
    const displayName=entryData?spokenForm(entry.word):entry.word;
    speak('Muito bem! '+displayName);
    // mark clue
    const clueEl=document.getElementById('clue-'+entry.dir+'-'+entry.id);
    if(clueEl){
      clueEl.classList.add('correct');
      clueEl.querySelector('.clue-txt')?.classList.add('correct');
    }
    vbOnWordSolved();
    updateScore();
    if(solvedEntries.length===puzzle.length) setTimeout(endGame,600);
  }
}

function isEntrySolved(entry){
  for(let i=0;i<entry.word.length;i++){
    const r=entry.dir==='across'?entry.row:entry.row+i;
    const c=entry.dir==='across'?entry.col+i:entry.col;
    const key=r+','+c;
    if(!gridData[key]||gridData[key].userInput!==entry.word[i]) return false;
  }
  return true;
}

function updateScore(){
  document.getElementById('score').textContent=solvedEntries.length+'/'+puzzle.length+' ✅';
}

function spokenForm(txt){
  let result=txt;
  const keys=Object.keys(PHONETIC).sort((a,b)=>b.length-a.length);
  keys.forEach(k=>{
    const re=new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    result=result.replace(re,PHONETIC[k]);
  });
  return result;
}

let sndOn=true;
function speak(txt){
  if(!sndOn) return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(spokenForm(txt));
    u.lang='pt-PT';u.rate=0.84;u.pitch=1.05;
    const vs=window.speechSynthesis.getVoices();
    const pt=vs.find(v=>v.lang==='pt-PT')||vs.find(v=>v.lang.startsWith('pt'));
    if(pt) u.voice=pt;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ─── ESCALA DA GRELHA ────────────────────────────────────────────
function scaleGrid(){
  const scaler = document.getElementById('gridScaler');
  const wrap   = document.getElementById('gridWrap');
  const grid   = document.getElementById('cwGrid');
  if(!scaler || !grid) return;

  // Reset scale to measure natural size
  scaler.style.transform = 'scale(1)';
  scaler.style.width  = '';
  scaler.style.height = '';

  const gridW = grid.scrollWidth;
  const gridH = grid.scrollHeight;
  if(!gridW || !gridH) return;

  // Available width inside the wrapper (subtract padding 14px*2)
  const available = wrap.clientWidth - 28;
  let scale = Math.min(1, available / gridW);
  if(window.innerWidth >= 700){
    // ecrã grande: aumenta a grelha para aproveitar a largura e a altura disponíveis
    const top = wrap.getBoundingClientRect().top + window.scrollY;
    const bn = document.getElementById('activeClueBanner');
    const bannerReserve = (bn && getComputedStyle(bn).display==='none') ? 100 : 0; // a dica ativa aparece logo a seguir
    const availH = window.innerHeight - top - 28 - 110 - bannerReserve;
    scale = Math.max(0.5, Math.min(2.8, available / gridW, availH / gridH));
  }

  scaler.style.transform = `scale(${scale})`;
  scaler.style.transformOrigin = 'top left';
  // Make wrapper height match scaled grid so layout doesn't collapse
  scaler.style.width  = gridW + 'px';
  scaler.style.height = (gridH * scale) + 'px';
  wrap.style.height   = (gridH * scale + 28) + 'px';
}
window.addEventListener('resize', scaleGrid);

// ─── DICA (HINT) ────────────────────────────────────────────────
function useHint(){
  if(!activeEntry) return;
  if(hintsUsed>=maxHints){
    vbSetMsg('Já usaste todas as dicas! 😅');
    return;
  }
  // find first empty or wrong cell in active entry
  let targetR=null,targetC=null;
  for(let i=0;i<activeEntry.word.length;i++){
    const r=activeEntry.dir==='across'?activeEntry.row:activeEntry.row+i;
    const c=activeEntry.dir==='across'?activeEntry.col+i:activeEntry.col;
    const key=r+','+c;
    const d=gridData[key];
    if(d && d.userInput!==d.letter){
      targetR=r;targetC=c;break;
    }
  }
  if(targetR===null) return; // word already complete
  
  const key=targetR+','+targetC;
  gridData[key].userInput=gridData[key].letter;
  const inp=getInput(targetR,targetC);
  if(inp) inp.value=gridData[key].displayLetter;
  checkCellCorrect(targetR,targetC);
  updateScore();
  
  hintsUsed++;
  updateHintBadge();
  updateWordPattern();
  vbSetMsg('Aqui tens uma ajuda! 💡');
  speak(gridData[key].displayLetter);
}

// ─── APAGAR (ERASER) ────────────────────────────────────────────
function eraseCell(){
  if(!activeEntry) return;
  // find focused input
  const focused=document.activeElement;
  if(focused && focused.tagName==='INPUT' && focused.dataset.r!=null){
    const r=parseInt(focused.dataset.r);
    const c=parseInt(focused.dataset.c);
    const key=r+','+c;
    const d=gridData[key];
    if(d){
      d.userInput='';
      focused.value='';
      checkCellCorrect(r,c);
      updateScore();
      updateWordPattern();
    }
  }
}

function launchConfetti(){
  const canvas=document.getElementById('confettiCanvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  
  const colors=['#FFD600','#1565ff','#7c3aed','#10b981','#ef4444','#f97316','#38bdf8','#ec4899'];
  const pieces=[];
  for(let i=0;i<120;i++){
    pieces.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height*-1 -20,
      w:Math.random()*8+4,
      h:Math.random()*5+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      vy:Math.random()*3+2,
      vx:(Math.random()-0.5)*2,
      rot:Math.random()*360,
      rv:(Math.random()-0.5)*8,
      opacity:1,
    });
  }
  
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rv;
      if(frame>90) p.opacity=Math.max(0,p.opacity-0.015);
      if(p.opacity<=0) return;
      alive=true;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=p.opacity;
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    frame++;
    if(alive && frame<220) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(draw);
}

  }
  ctx.restore();
}


let bubT=null;
function showBub(msg){
  const b=document.getElementById('fixed-bubble');
  b.textContent=msg;b.classList.add('show');
  clearTimeout(bubT);bubT=setTimeout(()=>b.classList.remove('show'),3500);
}
const vbRobot=document.getElementById('fixed-vb-robot');
const vbCtx=vbRobot.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,3);
vbRobot.width=96*DPR;vbRobot.height=96*DPR;vbCtx.scale(DPR,DPR);
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let vbBusy=false;
function vbSetFrame(blink,step,armsUp){ drawVBAtual(vbCtx,blink,step,armsUp); }
vbSetFrame(false,-1,false);
function vbBlink(){
  if(vbBusy)return;
  vbSetFrame(true,-1,false);
  setTimeout(()=>{ if(!vbBusy) vbSetFrame(false,-1,false); },180);
}
function vbWalk(steps,speed){
  steps=steps||6;speed=speed||170;
  if(vbBusy)return;
  vbBusy=true;let i=0;
  const iv=setInterval(()=>{
    vbSetFrame(false,i%2===0?0:1,false);i++;
    if(i>=steps){clearInterval(iv);vbSetFrame(false,-1,false);vbBusy=false;}
  },speed);
}
function vbJump(){
  if(vbBusy)return;
  vbBusy=true;
  vbRobot.classList.remove('bounce');void vbRobot.offsetWidth;vbRobot.classList.add('bounce');
  vbSetFrame('happy',-1,true);
  setTimeout(()=>{vbSetFrame(false,-1,false);vbBusy=false;},700);
}
setInterval(()=>{
  if(vbBusy||document.hidden||REDUCED)return;
  const r=Math.random();
  if(r<0.18)vbJump();else if(r<0.5)vbWalk();else vbBlink();
},3600);

const FS_IN='<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>';
const FS_OUT='<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v4H3M13 3v4h4M17 13h-4v4M3 13h4v4"/></svg>';
function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function toggleFullscreen(){
  const d=document,el=d.documentElement;
  try{
    if(!fsElement()){ const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch)p.catch(()=>{}); }
    else{ const p=(d.exitFullscreen||d.webkitExitFullscreen).call(d); if(p&&p.catch)p.catch(()=>{}); }
  }catch(e){}
}
function fsUpdate(){
  const b=document.getElementById('btnFs'); if(!b)return;
  const on=!!fsElement();
  b.innerHTML=on?FS_OUT:FS_IN;
  b.title=on?'Sair do ecrã inteiro':'Ecrã inteiro';
  b.setAttribute('aria-label',b.title);
  setTimeout(()=>window.dispatchEvent(new Event('resize')),150);
}
(function(){
  const b=document.getElementById('btnFs');
  const ok=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
  if(!ok){ if(b)b.style.display='none'; return; }   // ex.: iPhone não suporta
  fsUpdate();
  document.addEventListener('fullscreenchange',fsUpdate);
  document.addEventListener('webkitfullscreenchange',fsUpdate);
})();
</script>
